name: Feature request
description: Suggest a change to the firmware or the documentation
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the monitor does not let you do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including whether a change to your own copy would be enough.
